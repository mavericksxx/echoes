<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#DCD6BD" />
    <title>Echoes</title>
    <meta
      name="description"
      content="Echoes — a pixel village where each music genre lives as a Naruto character in its own district."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <div class="layout">
        <div class="content">
          <header class="topbar">
            <div class="topbar-nav">
              <button type="button" class="topbar-btn" id="backBtn" aria-label="Back to village" hidden>
                &#8249; Back
              </button>
              <span class="brand">Echoes</span>
              <div class="district-readout" id="topbarContext">
                <span class="district-readout__genre" id="districtGenre"></span>
                <span class="district-readout__name" id="districtName"></span>
              </div>
            </div>
            <div class="topbar-actions">
              <span class="status-chip" id="statusChip">Not connected</span>
              <button type="button" class="topbar-btn" id="topArtistsBtn" aria-expanded="false" aria-controls="topArtistsPanel" hidden>
                Top artists
              </button>
              <button type="button" class="topbar-btn" id="helpBtn" aria-label="How Echoes works">?</button>
            </div>
          </header>

          <div class="top-artists-backdrop" id="topArtistsBackdrop" hidden></div>
          <aside class="top-artists-panel" id="topArtistsPanel" hidden aria-hidden="true" aria-label="Your top artists"></aside>

          <!-- Phase 13b: first-visit onboarding, reopenable any time from
               #helpBtn above — populated by src/onboarding.ts. Starts hidden;
               shown automatically on a first visit (nothing dismissed yet in
               localStorage) or on demand. -->
          <div class="onboarding-backdrop" id="onboardingBackdrop" hidden></div>
          <div
            class="onboarding-modal"
            id="onboardingModal"
            hidden
            aria-hidden="true"
            role="dialog"
            aria-modal="true"
            aria-labelledby="onboardingTitle"
          ></div>

          <!-- Phase 5a: display-only now-playing card, populated by
               src/now-playing-card.ts. Starts hidden — shown only while
               something is actually playing. -->
          <aside class="now-playing-card" id="nowPlayingCard" hidden aria-hidden="true" aria-label="Now playing"></aside>

          <!-- Phase 8a: small, unobtrusive play-event log readout, populated
               by src/history-stats.ts. Starts hidden — shown only once
               /api/history/stats resolves, so there's never a flash of
               "0 plays" before the real number is known. Fixed bottom-left
               (see style.css) specifically so it never competes with the
               topbar on a phone. -->
          <p class="history-readout" id="historyReadout" hidden></p>

          <main class="main" id="main">
            <div class="stage-area" id="stageArea">
              <canvas id="game" tabindex="0" aria-label="Village stage"></canvas>
              <canvas id="captionLayer" class="caption-layer" aria-hidden="true"></canvas>
              <div class="zoom-controls">
                <button type="button" class="zoom-btn" id="zoomInBtn" aria-label="Zoom in">+</button>
                <button type="button" class="zoom-btn" id="zoomOutBtn" aria-label="Zoom out">&minus;</button>
              </div>
              <!-- Phase 13a: Snapshot / Record / Sound — src/capture.ts and
                   src/sound.ts. Fixed (not part of .stage-area's own box),
                   top-left, clearing the topbar the same way
                   .now-playing-card's top-right offset does, so it never
                   competes with .zoom-controls (bottom-right) or
                   .history-readout (bottom-left) for a corner. -->
              <div class="media-controls" id="mediaControls">
                <button type="button" class="media-btn" id="snapshotBtn" aria-label="Save a snapshot of the village">Snapshot</button>
                <button type="button" class="media-btn" id="recordBtn" aria-pressed="false" aria-label="Record a short clip of the village">
                  Record
                </button>
                <button type="button" class="media-btn" id="soundBtn" aria-pressed="false" aria-label="Turn sound on">Sound</button>
                <span class="media-controls__indicator" id="recordIndicator" hidden aria-live="polite"></span>
              </div>
            </div>

            <p class="village-caption" id="villageCaption">
              Drag to look around Konoha. Tap anyone to see their genre.
            </p>

            <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
            <aside class="sidebar" id="sidebar" hidden aria-hidden="true"></aside>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
