<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181322" />
    <title>Echoes</title>
    <meta
      name="description"
      content="Echoes — a pixel village where each music genre lives as a Naruto character in its own district."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <div class="layout">
        <div class="content">
          <header class="topbar">
            <span class="brand">Echoes</span>
            <nav class="view-switch" aria-label="View">
              <button type="button" class="view-tab" data-view="village">
                <span class="view-tab__label">Village</span>
              </button>
              <button type="button" class="view-tab" data-view="district">
                <span class="view-tab__label">Districts</span>
              </button>
              <button type="button" class="view-tab" data-view="roster">
                <span class="view-tab__label">Roster</span>
              </button>
            </nav>
          </header>

          <main class="main" id="main">
            <div class="district-toolbar" id="districtToolbar" hidden>
              <button type="button" class="icon-btn" id="prevBtn" aria-label="Previous district">
                &#8249;
              </button>
              <div class="district-readout">
                <span class="district-readout__genre" id="districtGenre"></span>
                <span class="district-readout__name" id="districtName"></span>
              </div>
              <button type="button" class="icon-btn" id="nextBtn" aria-label="Next district">
                &#8250;
              </button>
            </div>

            <p class="village-caption" id="villageCaption">
              Drag to look around Konoha. Tap anyone to see their genre.
            </p>

            <div class="stage-area" id="stageArea">
              <canvas id="game" tabindex="0" aria-label="Village stage"></canvas>
              <div class="zoom-controls">
                <button type="button" class="zoom-btn" id="zoomInBtn" aria-label="Zoom in">+</button>
                <button type="button" class="zoom-btn" id="zoomOutBtn" aria-label="Zoom out">&minus;</button>
              </div>
            </div>
            <p class="recolor-note" id="recolorNote" hidden></p>

            <div class="roster" id="roster" hidden></div>
          </main>
        </div>

        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <aside class="sidebar" id="sidebar" hidden aria-hidden="true"></aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
